name: Build notebook

on:
  push:
    branches: [main]
    paths:
      - "wildfire_susceptibility_rf_intro.py"
      - ".github/workflows/build-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jupytext
        run: python -m pip install jupytext

      - name: Convert lesson to notebook
        run: |
          jupytext --to ipynb wildfire_susceptibility_rf_intro.py

      - name: Commit generated notebook
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build Colab notebook"
          file_pattern: wildfire_susceptibility_rf_intro.ipynb
